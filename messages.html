<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Applies saved appearance (font, color, background) before first paint — must stay first, as a classic (non-module) script, to avoid a flash of default styling. -->
<script src="appearance-core.js"></script>
<script src="autofill-guard.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Messages — Love Wonders</title>
<link rel="icon" href="favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<meta name="theme-color" content="#05040d">
<meta name="msapplication-TileImage" content="mstile-150.png?v=2">
<meta name="msapplication-TileColor" content="#05040d">
<link rel="stylesheet" href="styles.css">
</head>
<body data-mode="dark">

  <div id="sidebar-overlay" class="sidebar-overlay" hidden></div>
  <aside id="app-sidebar" class="app-sidebar" aria-hidden="true">
    <div class="sidebar-head">
      <div class="brand">Love <em>Wonders</em></div>
      <button id="sidebar-close" class="sidebar-close" type="button" aria-label="Close menu">&times;</button>
    </div>
    <div id="side-mount"></div>
  </aside>

  <div class="bubble-field" aria-hidden="true">
    <span style="left:8%; width:16px; height:16px; animation-duration:6.5s;"></span>
    <span style="left:22%; width:10px; height:10px; animation-duration:8s; animation-delay:1s;"></span>
    <span style="left:71%; width:14px; height:14px; animation-duration:7s; animation-delay:.4s;"></span>
    <span style="left:88%; width:9px; height:9px; animation-duration:9s; animation-delay:2s;"></span>
  </div>

  <div class="shell">
    <div class="topbar">
      <button id="menu-toggle" class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="app-sidebar">
        <span></span><span></span><span></span>
      </button>
      <div class="brand">Love <em>Wonders</em></div>
      <div class="topbar-actions">
        <div id="notif-mount" class="notif-mount"></div>
        <button id="logout-btn" class="btn ghost small" type="button">Log out</button>
      </div>
    </div>
    <div id="nav-mount"></div>

    <h1 style="margin-top:32px;">Messages</h1>
    <p class="muted">Every conversation you've started, in one place.</p>

    <div class="messages-shell">
      <div id="inbox-panel" class="inbox-panel">
        <div class="inbox-search">
          <input id="inbox-search-input" data-autofill-wipe type="text" placeholder="Search conversations…" autocomplete="off">
          <div class="inbox-filters">
            <button type="button" class="inbox-filter-tab active" data-filter="all">All</button>
            <button type="button" class="inbox-filter-tab" data-filter="new">
              New responders<span id="new-count-badge" class="filter-count" style="display:none;"></span>
            </button>
          </div>
        </div>
        <div id="convo-list"></div>
        <p id="no-convos" class="muted" style="display:none; padding:18px; font-size:13px;">
          No conversations yet — head to <a href="discover.html">Discover</a> and say hello.
        </p>
        <p id="no-new-convos" class="muted" style="display:none; padding:18px; font-size:13px;">
          No new responders right now — anyone who texts you back or reaches out first will show up here.
        </p>
      </div>

      <div id="chat-panel-wrap" class="chat-panel-wrap">
        <div id="chat-placeholder" class="chat-placeholder">
          <span class="lock-icon">&#10084;</span>
          Pick a conversation to see it here.
        </div>
        <div id="chat-mount" style="width:100%; display:none;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="messages.js"></script>
</body>
</html>
